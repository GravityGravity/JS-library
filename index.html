<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>JS Library</title>
		<link rel="stylesheet" href="styles.css" />
		<script src="script.js" defer></script>
	</head>
	<body>
		<h1>JS Library</h1>
		<p>Open your console with <kbd>F12</kbd>!</p>

		<button class="update" type="button">UPDATE</button>
		<button class="add-book" type="button">ADD A BOOK</button>

		<dialog closedby="any">
			<form method="dialog">
				<label for="title">Title</label>
				<input id="title" name="title" type="text" required />

				<label for="year">Year</label>
				<input maxlength="4" id="year" name="year" type="number" required />

				<label for="author">Author</label>
				<input id="author" name="author" type="text" required />

				<label>Have you read it?</label>
				<input name="readStatus" type="checkbox" />

				<button type="submit" dialog>SUBMIT</button>
			</form>
		</dialog>

		<table>
			<thead>
				<tr>
					<th>Title</th>
					<th>Year</th>
					<th>Author</th>
					<th>Unique ID</th>
					<th>Read</th>
				</tr>
			</thead>

			<tbody></tbody>
		</table>
	</body>
</html>
